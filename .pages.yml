# Pages CMS configuration (pagescms.org). Lets you write journal posts in the browser.
media:
  input: src/images
  output: /images
content:
  - name: journal
    label: Journal
    type: collection
    path: src/journal
    filename: "{primary}.md"
    exclude: [index.njk, journal.json]
    view:
      fields: [title, date]
      primary: title
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
      - name: date
        label: Date
        type: date
        options:
          time: true
      - name: description
        label: Short description (shows on cards)
        type: text
      - name: cover
        label: Cover photo
        type: image
      - name: coverAlt
        label: Cover photo description (for screen readers)
        type: string
      - name: coverPosition
        label: Cover crop position (optional, like "50% 30%")
        type: string
      - name: draft
        label: Draft (hide from the site)
        type: boolean
      - name: body
        label: Post
        type: rich-text
  - name: gear
    label: Gear
    type: collection
    path: src/gear
    filename: "{primary}.md"
    exclude: [gear.json]
    view:
      fields: [title, category, order]
      primary: title
      sort: [order]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Name
        type: string
      - name: tagline
        label: One-line tagline (like "Full-frame mirrorless, 20MP")
        type: string
      - name: category
        label: Section
        type: select
        options:
          values: [Cameras, Lenses, Accessories, Software]
      - name: order
        label: Order within its section (1 is first)
        type: number
      - name: status
        label: Label (optional, like Primary, Backup, Favorite)
        type: string
      - name: draft
        label: Draft (hide from the page)
        type: boolean
      - name: body
        label: Why I use it (optional)
        type: rich-text
