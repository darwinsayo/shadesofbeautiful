# Pages CMS configuration (pagescms.org). Lets you write journal posts in the browser.
media:
  input: src/images
  output: /images
content:
  - name: journal
    label: Journal
    type: collection
    path: src/journal
    filename: "{primary}.md"
    exclude: [index.njk, journal.json]
    view:
      fields: [title, date]
      primary: title
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
      - name: date
        label: Date
        type: date
        options:
          time: true
      - name: description
        label: Short description (shows on cards)
        type: text
      - name: cover
        label: Cover photo
        type: image
      - name: coverAlt
        label: Cover photo description (for screen readers)
        type: string
      - name: coverPosition
        label: Cover crop position (optional, like "50% 30%")
        type: string
      - name: draft
        label: Draft (hide from the site)
        type: boolean
      - name: body
        label: Post
        type: rich-text
